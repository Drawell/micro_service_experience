apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-http-depl
  labels:
    app: flask_task_list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask_task_list
  template:
    metadata:
      labels:
        app: flask_task_list
    spec:
      containers:
        - name: flask-container
          image: flask_app
          imagePullPolicy: Never
          livenessProbe:
            httpGet:
              path: /unhealth
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: http-service
spec:
  selector:
    app: flask_task_list
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30002
  type: NodePort
