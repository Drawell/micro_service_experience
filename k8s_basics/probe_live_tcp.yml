apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-tcp-depl
  labels:
    app: flask_task_list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask_task_list
  template:
    metadata:
      labels:
        app: flask_task_list
    spec:
      containers:
        - name: flask-container
          image: flask_app
          imagePullPolicy: Never
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tcp-service
spec:
  selector:
    app: flask_task_list
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30002
  type: NodePort

