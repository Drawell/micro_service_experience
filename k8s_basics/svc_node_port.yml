apiVersion: v1
kind: Service
metadata:
  name: node-port-service
spec:
  sessionAffinity: CientIP  # From one client to one pod (not random)
  selector:
    app: flask_task_list
  ports:
    - protocol: TCP
      port: 80
      targetPort: default-port
      nodePort: 30080  # port-range: 30000 - 32767
  type: NodePort
